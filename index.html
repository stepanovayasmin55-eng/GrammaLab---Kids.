<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrammaLab Kids — Конструктор</title>
    <style>
        :root { --p: #6a0dad; --black: #1a1a1a; --white: #ffffff; --blue: #00a2ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--p); color: var(--white); margin: 0; padding: 0; }
        
        header { background: var(--black); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--white); }
        .ai-btn { background: var(--white); color: var(--black); border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        .container { max-width: 800px; margin: 20px auto; padding: 10px; }

        /* Поле заголовка */
        .box { background: rgba(0,0,0,0.3); border: 2px solid var(--white); border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .label { font-size: 12px; opacity: 0.8; margin-bottom: 5px; }
        input[type="text"] { background: rgba(255,255,255,0.1); border: 1px solid var(--white); color: white; padding: 10px; border-radius: 5px; width: 100%; box-sizing: border-box; font-size: 16px; outline: none; }

        /* Карточка вопроса */
        .q-card { background: rgba(0,0,0,0.5); border: 2px solid var(--white); border-radius: 15px; padding: 25px; position: relative; margin-bottom: 30px; box-shadow: 8px 8px 0px var(--black); }
        .q-num { position: absolute; left: -15px; top: -15px; background: var(--white); color: var(--black); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        .ans-row { display: flex; align-items: center; gap: 10px; margin-top: 15px; }
        .ans-letter { background: var(--white); color: var(--black); width: 30px; height: 30px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        
        .correct-btn { background: none; border: 2px solid var(--white); color: var(--white); width: 35px; height: 35px; border-radius: 5px; cursor: pointer; font-size: 20px; }
        .correct-btn.active { background: #27ae60; border-color: #27ae60; }

        .btn-add { color: #5bc0de; cursor: pointer; font-weight: bold; display: inline-block; margin-top: 15px; text-decoration: underline; }
        .btn-done { background: var(--blue); color: white; border: 2px solid var(--black); padding: 15px; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 30px; box-shadow: 5px 5px 0 var(--black); }

        /* Зона игры (Колесо) */
        #game-view { display: none; text-align: center; padding: 50px 20px; }
        .wheel { width: 280px; height: 280px; border: 8px solid var(--white); border-radius: 50%; margin: 30px auto; transition: transform 3s cubic-bezier(0.1, 0, 0, 1); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; background: conic-gradient(var(--black) 0% 25%, var(--p) 25% 50%, var(--black) 50% 75%, var(--p) 75% 100%); }
    </style>
</head>
<body>

<header>
    <div style="font-size: 20px; font-weight: bold;">💜 GrammaLab Kids</div>
    <button class="ai-btn" onclick="fillAI()">✨ ИИ ПОМОЩЬ</button>
</header>

<div class="container" id="editor">
    <div class="box">
        <div class="label">Заголовок занятия</div>
        <input type="text" id="title" value="Безымянный2">
    </div>

    <div class="q-card">
        <div class="q-num">1.</div>
        <div class="label">Вопрос</div>
        <input type="text" id="question" placeholder="Введите вопрос здесь...">
        
        <div class="label" style="margin-top: 20px;">Ответы</div>
        
        <div class="ans-row">
            <div class="ans-letter">а</div>
            <input type="text" id="a1" placeholder="Вариант ответа">
            <button class="correct-btn" onclick="mark(this)">✔</button>
        </div>

        <div class="ans-row">
            <div class="ans-letter">б</div>
            <input type="text" id="a2" placeholder="Вариант ответа">
            <button class="correct-btn" onclick="mark(this)">✖</button>
        </div>

        <div class="ans-row">
            <div class="ans-letter">в</div>
            <input type="text" id="a3" placeholder="Вариант ответа">
            <button class="correct-btn" onclick="mark(this)">✖</button>
        </div>

        <div class="btn-add">➕ Добавить больше ответов</div>
    </div>

    <div class="btn-add" style="font-size: 18px;">➕ Добавить вопрос</div>
    
    <button class="btn-done" onclick="finish()">ВЫПОЛНЕНО</button>
</div>

<div id="game-view">
    <h1 id="game-title-view">Игра</h1>
    <div class="wheel" id="main-wheel">КРУТИ!</div>
    <button class="btn-done" style="background:#27ae60" onclick="spin()">КРУТИТЬ КОЛЕСО</button>
    <button class="btn-done" style="background:#666" onclick="location.reload()">ВЕРНУТЬСЯ К РЕДАКТОРУ</button>
</div>

<script>
    function mark(btn) {
        btn.classList.toggle('active');
        btn.innerText = btn.classList.contains('active') ? '✔' : '✖';
    }

    function fillAI() {
        document.getElementById('question').value = "В каком слове пишется буква И?";
        document.getElementById('a1').value = "Ж..знь";
        document.getElementById('a2').value = "М..шина";
        document.getElementById('a3').value = "П..сьмо";
        alert("ИИ заполнил контент!");
    }

    function finish() {
        document.getElementById('editor').style.display = 'none';
        document.getElementById('game-view').style.display = 'block';
        document.getElementById('game-title-view').innerText = document.getElementById('title').value;
    }

    let rot = 0;
    function spin() {
        rot += 1800 + Math.random() * 360;
        document.getElementById('main-wheel').style.transform = `rotate(${rot}deg)`;
        setTimeout(() => { alert("🎯 Вопрос: " + document.getElementById('question').value); }, 3100);
    }
</script>

</body>
</html>
